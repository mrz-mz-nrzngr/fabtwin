# Mosquitto for the FabTwin Sparkplug path: plain MQTT for edge nodes, MQTT over WebSocket for the browser.
# Ports are off the defaults so it does not collide with another broker on the machine.
# Local demo only: anonymous access, bound to loopback. Add password_file and TLS before exposing it.
persistence false
allow_anonymous true
log_type error
log_type warning
log_type notice

listener 18830 127.0.0.1
protocol mqtt

listener 18831 127.0.0.1
protocol websockets
